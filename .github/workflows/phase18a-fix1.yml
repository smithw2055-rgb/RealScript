name: Phase 18A Fix Pass

on:
  push:
    branches:
      - agent/native-language-and-runtime-evolution

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: apply
        shell: bash
        run: |
          set +e
          python tools/ci/apply_phase18a_fix1.py > phase18a-fix1.log 2>&1
          status=$?
          cat phase18a-fix1.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            cp phase18a-fix1.log phase18a-fix1-failure.log
          fi
          exit 0
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No fix changes"
          else
            if [ "${{ steps.apply.outputs.status }}" = "0" ]; then
              git commit -m "Fix Phase 18A native control-flow build"
            else
              git commit -m "Record Phase 18A fix failure"
            fi
            git push origin HEAD:agent/native-language-and-runtime-evolution
          fi

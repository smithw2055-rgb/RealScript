name: Export Phase 3A Source

on:
  pull_request:
    branches:
      - agent/managed-heap-incremental-gc

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 3A base
        uses: actions/checkout@v4
        with:
          ref: agent/managed-heap-incremental-gc

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=build -czf "$RUNNER_TEMP/realscript-source.tar.gz" .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: realscript-phase3a-source
          path: ${{ runner.temp }}/realscript-source.tar.gz
          if-no-files-found: error

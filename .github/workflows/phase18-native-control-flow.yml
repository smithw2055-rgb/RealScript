name: Phase 18 Native Control Flow

on:
  push:
    branches:
      - agent/native-language-and-runtime-evolution

permissions:
  contents: write

jobs:
  apply-migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply native control-flow migration
        id: migrate
        shell: bash
        run: |
          set +e
          python tools/ci/apply_phase18a_native_control_flow.py > phase18a-migration.log 2>&1
          status=$?
          cat phase18a-migration.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            cp phase18a-migration.log phase18a-migration-failure.log
          fi
          exit 0
      - name: Commit migration result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
          else
            if [ "${{ steps.migrate.outputs.status }}" = "0" ]; then
              git commit -m "Implement native Phase 18A control flow"
            else
              git commit -m "Record Phase 18A migration failure"
            fi
            git push origin HEAD:agent/native-language-and-runtime-evolution
          fi

name: Phase 18 Native Control Flow

on:
  push:
    branches:
      - agent/native-language-and-runtime-evolution

permissions:
  contents: write

jobs:
  apply-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply native control-flow migration
        run: python tools/ci/apply_phase18a_native_control_flow.py
      - name: Configure
        run: cmake -S . -B build -DREALSCRIPT_BUILD_TESTS=ON -DREALSCRIPT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
          else
            git commit -m "Implement native Phase 18A control flow"
            git push origin HEAD:agent/native-language-and-runtime-evolution
          fi

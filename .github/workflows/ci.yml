name: RealScript CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installation) {
            throw "Visual Studio C++ toolchain was not found"
          }
          $vsDevCmd = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          $environment = & $env:ComSpec /d /s /c `
            "`"$vsDevCmd`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) {
            throw "VsDevCmd failed with exit code $LASTEXITCODE"
          }
          foreach ($entry in $environment) {
            if ($entry -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File `
                -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Configure
        run: >-
          python tools/ci/run_and_capture.py configure.log --
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DREALSCRIPT_BUILD_TESTS=ON
          -DREALSCRIPT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: >-
          python tools/ci/run_and_capture.py build.log --
          cmake --build build --config ${{ matrix.configuration }}

      - name: Test
        run: >-
          python tools/ci/run_and_capture.py test.log --
          ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure

      - name: Upload CI failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            configure.log
            build.log
            test.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

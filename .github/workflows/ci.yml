name: RealScript CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-phase19-virtual-dispatch:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/phase19-runtime-polymorphism'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Phase 19 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply validated virtual dispatch patch
        run: python tools/ci/apply_phase19_virtual_patch.py

      - name: Commit Phase 19 virtual dispatch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implement Phase 19 virtual dispatch"
          git push origin HEAD:${{ github.head_ref }}

name: Apply Phase 1C bundle

on:
  push:
    branches:
      - agent/function-calls-modules-incremental
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/function-calls-modules-incremental
          fetch-depth: 0

      - name: Apply source bundle
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .phase1c.tar.gz.b64 > /tmp/phase1c.tar.gz
          tar -xzf /tmp/phase1c.tar.gz
          rm .phase1c.tar.gz.b64
          rm .github/workflows/apply-phase1c.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add calls modules and incremental compilation"
          git push origin HEAD:agent/function-calls-modules-incremental

name: Rebuild Phase 18 Attributes

on:
  push:
    branches:
      - agent/native-language-and-runtime-evolution

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/ci/rebuild_phase18_attributes.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Rebuild native Phase 18 source attributes"
          git push origin HEAD:agent/native-language-and-runtime-evolution

name: Rebuild Phase 18 Attributes

on:
  push:
    branches:
      - agent/native-language-and-runtime-evolution

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: rebuild
        shell: bash
        run: |
          set +e
          python tools/ci/rebuild_phase18_attributes.py > phase18-attributes-rebuild.log 2>&1
          status=$?
          cat phase18-attributes-rebuild.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            cp phase18-attributes-rebuild.log phase18-attributes-rebuild-failure.log
          fi
          exit 0
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No rebuild changes"
          else
            if [ "${{ steps.rebuild.outputs.status }}" = "0" ]; then
              git commit -m "Rebuild native Phase 18 source attributes"
            else
              git commit -m "Record native attribute rebuild failure"
            fi
            git push origin HEAD:agent/native-language-and-runtime-evolution
          fi
